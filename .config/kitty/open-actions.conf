# -----------------------------------------------------------------------------
# Kitty URL & File Click Actions (open-actions.conf)
# -----------------------------------------------------------------------------

# 1. Open Image files in a full-resolution in-terminal GPU overlay via kitten icat
# Press 'q' or 'Escape' inside the overlay to dismiss it instantly.
protocol file
mime image/*
action launch --type=overlay kitten icat --hold ${FILE_PATH}

# 2. Open PDF documents via macOS Preview
protocol file
mime application/pdf
action launch --type=background open ${FILE_PATH}

# 3. Open Directories in a new Kitty Tab
protocol file
mime inode/directory
action launch --type=tab --cwd ${FILE_PATH}

# 4. Open Text, Markdown, and Code files in VS Code
protocol file
mime text/*
action launch --type=background code ${FILE_PATH}

# 5. Default Fallback -> Launch with macOS system handler
protocol file
action launch --type=background open ${FILE_PATH}
