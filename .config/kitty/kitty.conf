# Kitty Configuration
#
# Load order matters: kitty resolves options last-wins, so the theme is included
# FIRST as a colour base and everything below it is an intentional override.
# theme.conf is deliberately NOT named *.auto.conf -- kitty auto-discovers that
# suffix and its colours then override the whole config regardless of position.
include theme.conf

# Remote Control
# socket-only keeps `kitten @ --to unix:/tmp/mykitty` working while denying
# control to anything that can merely write to the tty -- notably programs on
# the far end of an ssh session.
allow_remote_control socket-only
listen_on unix:/tmp/mykitty

# Shell
shell_integration enabled no-sudo

# Font
font_family      Hack
font_size        14.0

# Scrollback
scrollback_lines 100000

# Window
hide_window_decorations titlebar-only
macos_titlebar_color background
confirm_os_window_close 0
window_padding_width 10

# Tab Bar
# The three greys here are load-bearing, not a mismatch to be tidied away:
#   tab_bar_margin_color  paints the 5px strips above/below the tab row
#   inactive_tab_background paints the tab row itself (and, via tab_bar.py's
#     right-hand filler, everything up to the hostname chip)
# Keeping the row one step lighter than its margins is what makes the bar read
# as a ribbon floating over the window rather than a flat band. Flattening them
# to a single grey kills the effect.
tab_bar_edge top
tab_bar_style custom
tab_bar_min_tabs 1
tab_bar_margin_height 5.0 5.0
tab_title_template "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{title}"
active_tab_foreground   #1c1c1c
active_tab_background   #709772
active_tab_font_style   bold
inactive_tab_foreground #c8c8c8
inactive_tab_background #282828
inactive_tab_font_style normal
tab_bar_background      #252525
tab_bar_margin_color    #252525

# Background Opacity
background_opacity 0.75
dynamic_background_opacity yes

# Selection
copy_on_select yes
strip_trailing_spaces smart

# URLs
url_excluded_characters )
